<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juan Igurtua | Financial Services</title>

    <meta
        name="description"
        content="Juan Igurtua Financial Services. Build your future in the financial services industry."
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #17110e;
            color: #f2e5d5;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            background: #17110e;
        }

        /* HERO / FLYER */

        .flyer-section {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #17110e;
        }

        .flyer {
            width: 100%;
            max-width: 1100px;
            height: auto;
            display: block;
        }

        /* INTRO */

        .intro {
            max-width: 1000px;
            margin: auto;
            padding: 70px 25px;
            text-align: center;
        }

        .eyebrow {
            color: #d5ae83;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .intro h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(42px, 7vw, 75px);
            line-height: 1;
            margin-bottom: 20px;
            color: #f2e5d5;
        }

        .intro h1 span {
            color: #c18b64;
        }

        .intro p {
            max-width: 700px;
            margin: auto;
            color: #cdbbaa;
            font-size: 17px;
            line-height: 1.8;
        }

        /* OPPORTUNITY */

        .opportunity {
            padding: 75px 25px;
            border-top: 1px solid #49372b;
            border-bottom: 1px solid #49372b;
        }

        .container {
            max-width: 1050px;
            margin: auto;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .
